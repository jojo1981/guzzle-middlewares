            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.4"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.4"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.4"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.4"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.4"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.4"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.4"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.4"
            symfony-component-version: "^7.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.4"
            symfony-component-version: "^7.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.4"
