name: PHP Build

on:
  push:
    branches: [ "main", "bugfix/*", "feature/*", "release/*" ]
  pull_request:
    branches: [ "main", "bugfix/*", "feature/*", "release/*" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      # guzzlehttp/guzzle 6.x is EOL. Several advisories against it have no lower bound
      # (e.g. CVE-2026-69245 "<7.15.2", CVE-2026-67353 "<7.15.1"), so every 6.x release
      # matches and Composer >= 2.10 refuses to install it. Unblock this for the ^6.0 jobs
      # only, so the matrix can still verify guzzle 6 support; ^7.0/^8.0 keep blocking on.
      COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.guzzlehttp-guzzle-component-version == '^6.0' && 'false' || 'true' }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # PHP 8.1
          - php-version: "8.1"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.1"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.1"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.1"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.1"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.1"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.1"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.1"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.1"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          # PHP 8.2
          - php-version: "8.2"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.2"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.2"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.2"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.2"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.2"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.2"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.2"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.2"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.2"
            symfony-component-version: "^7.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.2"
            symfony-component-version: "^7.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.2"
            symfony-component-version: "^7.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          # PHP 8.3
          - php-version: "8.3"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.3"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.3"
            symfony-component-version: "^4.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.3"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.3"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.3"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.3"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.3"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.3"
