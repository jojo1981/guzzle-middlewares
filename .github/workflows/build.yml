          - php-version: "8.5"
            symfony-component-version: "^5.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.5"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.5"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.5"
            symfony-component-version: "^6.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.5"
            symfony-component-version: "^7.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.5"
            symfony-component-version: "^7.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.5"
            symfony-component-version: "^7.0"
            guzzlehttp-guzzle-component-version: "^8.0"

          - php-version: "8.5"
            symfony-component-version: "^8.0"
            guzzlehttp-guzzle-component-version: "^6.0"
          - php-version: "8.5"
            symfony-component-version: "^8.0"
            guzzlehttp-guzzle-component-version: "^7.0"
          - php-version: "8.5"
            symfony-component-version: "^8.0"
            guzzlehttp-guzzle-component-version: "^8.0"

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: 'xdebug' # Setup the code coverage driver
          tools: 'composer:latest' # Setup popular tools

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          # composer.lock is not committed, so hashFiles() matches nothing and cannot
          # distinguish the matrix combinations. Key on the dependency versions instead,
          # otherwise all jobs sharing a PHP version restore each other's vendor dir.
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-sf-${{ matrix.symfony-component-version }}-guzzle-${{ matrix.guzzlehttp-guzzle-component-version }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-sf-${{ matrix.symfony-component-version }}-

      - name: Install dependencies
        run: |
          composer require symfony/filesystem:${{ matrix.symfony-component-version }} --no-update
          composer require symfony/event-dispatcher:${{ matrix.symfony-component-version }} --no-update
          composer require guzzlehttp/guzzle:${{ matrix.guzzlehttp-guzzle-component-version }} --no-update
          composer install --prefer-dist --no-progress

      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './var/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Tests (PHPUnit)
        env:
          # phpunit.xml.dist configures coverage reports, and PHPUnit runs no tests at all (exiting
          # 1) when no coverage driver is active. setup-php installs xdebug above, this switches it
          # into coverage mode.
          XDEBUG_MODE: coverage
        run: composer test

      - name: Code Quality (PHPStan)
        run: |
          composer global require phpstan/phpstan
          phpstan analyse src --level=5
